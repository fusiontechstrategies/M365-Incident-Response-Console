name: Security Scanners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "19 9 * * 6"

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    # PSScriptAnalyzer remains the language-aware code scanner for PowerShell.
    # The shared Semgrep registry configuration has no applicable PowerShell rules.
    uses: fusiontechstrategies/FusionTechStrategies/.github/workflows/reusable-security.yml@f64c8eb98fa6c907e013d158089ea6ab38e91ad7
    with:
      enable_semgrep: false
