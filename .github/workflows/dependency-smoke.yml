name: Dependency smoke test

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep scheduled/manual runs mutually exclusive while allowing each pull
  # request to validate independently without delaying the maintenance run.
  group: dependency-smoke-${{ github.event.pull_request.number || 'scheduled-manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep this workflow unfiltered so the gate always reports a result that can
  # safely become a required check; only the expensive Windows job is scoped.
  scope:
    name: Determine dependency smoke scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-smoke: ${{ steps.scope.outputs.run-smoke }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether live dependency validation is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run-smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_smoke=false
          changed_paths_file=$(mktemp)
          trap 'rm -f "$changed_paths_file"' EXIT
          if ! git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths_file"; then
            echo "Unable to determine changed pull-request paths." >&2
            exit 1
          fi
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              M365-IR-Console.ps1|.github/workflows/dependency-smoke.yml)
                run_smoke=true
                break
                ;;
            esac
          done < "$changed_paths_file"
          echo "run-smoke=$run_smoke" >> "$GITHUB_OUTPUT"

  current-modules:
    name: Current Microsoft modules
    needs: scope
    if: needs.scope.outputs.run-smoke == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and import dependency baselines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./M365-IR-Console.ps1 -NoAutoConnect -SkipPreflight

          $rows = foreach ($entry in $script:IRModuleCatalog.GetEnumerator()) {
              $name = [string]$entry.Key
              $required = [version]$entry.Value.MinimumVersion
              $latest = Find-PSResource -Name $name -Repository PSGallery -Type Module |
                  Sort-Object Version -Descending |
                  Select-Object -First 1
              if ($null -eq $latest) {
                  throw "PowerShell Gallery did not return $name."
              }
              if ([version]$latest.Version -ne $required) {
                  throw "Dependency baseline drift for $name. Script: $required. Gallery: $($latest.Version)."
              }
              Install-PSResource -Name $name -Version $required -Repository PSGallery -Scope CurrentUser -TrustRepository -AcceptLicense -Quiet
              $loaded = Import-Module -Name $name -RequiredVersion $required -PassThru -Force -ErrorAction Stop |
                  Sort-Object Version -Descending |
                  Select-Object -First 1
              [pscustomobject]@{
                  Module = $name
                  Required = $required
                  Loaded = $loaded.Version
                  Result = 'Pass'
              }
          }
          $rows | Format-Table -AutoSize

          $commandContracts = [ordered]@{
              'Revoke-MgUserSignInSession' = 'Microsoft.Graph.Users.Actions'
              'Remove-MgOauth2PermissionGrant' = 'Microsoft.Graph.Identity.SignIns'
              'Get-MgServicePrincipal' = 'Microsoft.Graph.Applications'
              'Get-MgAuditLogSignIn' = 'Microsoft.Graph.Reports'
              'Get-MgGroupMember' = 'Microsoft.Graph.Groups'
              'Get-MgDirectoryRoleTemplate' = 'Microsoft.Graph.Identity.DirectoryManagement'
              'Get-MgUserManagedDevice' = 'Microsoft.Graph.Devices.CorporateManagement'
              'Remove-MgDeviceManagementManagedDevice' = 'Microsoft.Graph.DeviceManagement'
              'Connect-MicrosoftTeams' = 'MicrosoftTeams'
              'Connect-SPOService' = 'Microsoft.Online.SharePoint.PowerShell'
          }
          foreach ($contract in $commandContracts.GetEnumerator()) {
              $command = Get-Command -Name $contract.Key -ErrorAction Stop
              if ([string]$command.Source -ne [string]$contract.Value) {
                  throw "$($contract.Key) resolved from $($command.Source), expected $($contract.Value)."
              }
          }

          $preflight = Test-IRPreflight
          if ($preflight.Overall -ne 'Pass') {
              $preflight.Checks | Format-Table -Wrap -AutoSize
              throw "Offline preflight returned $($preflight.Overall)."
          }

  gate:
    name: Dependency smoke gate
    if: always()
    needs: [scope, current-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm dependency validation passed or was not required
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_SMOKE: ${{ needs.scope.outputs.run-smoke }}
          SMOKE_RESULT: ${{ needs.current-modules.result }}
        run: |
          test "$SCOPE_RESULT" = "success"
          if test "$RUN_SMOKE" = "true"; then
            test "$SMOKE_RESULT" = "success"
          else
            test "$SMOKE_RESULT" = "skipped"
          fi
