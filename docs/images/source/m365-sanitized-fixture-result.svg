<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title description">
  <title id="title">M365 Incident Response Console sanitized fixture result</title>
  <desc id="description">Sanitized Audit-mode case excerpt showing two completed collection sources, one partial audit source, one unavailable licensed source, a four-item investigator decision queue, and the boundary between tamper evidence and organizational chain of custody.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1426"/>
      <stop offset="0.55" stop-color="#132841"/>
      <stop offset="1" stop-color="#0b1729"/>
    </linearGradient>
    <linearGradient id="statusPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122d43"/>
      <stop offset="1" stop-color="#101e31"/>
    </linearGradient>
    <linearGradient id="queuePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22233b"/>
      <stop offset="1" stop-color="#171d2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020712" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="1480" fill="url(#background)"/>
  <circle cx="1110" cy="-75" r="315" fill="#2c73a7" opacity="0.13"/>
  <circle cx="60" cy="1440" r="325" fill="#58457c" opacity="0.11"/>

  <text x="70" y="68" fill="#77d6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.7">M365 INCIDENT RESPONSE CONSOLE</text>
  <text x="70" y="123" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Missing evidence stays visible.</text>
  <text x="70" y="165" fill="#b7c6d7" font-family="Segoe UI, Arial, sans-serif" font-size="20">A sanitized case result should drive decisions, not false reassurance</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="1060" height="108" rx="20" fill="#172e4b" stroke="#3b6387" stroke-width="2"/>
  </g>
  <rect x="98" y="231" width="230" height="56" rx="13" fill="#0c1a2a" stroke="#77d6ff" stroke-width="2"/>
  <text x="213" y="253" text-anchor="middle" fill="#77d6ff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.3">SANITIZED FIXTURE</text>
  <text x="213" y="276" text-anchor="middle" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">constructed test data</text>
  <line x1="359" y1="231" x2="359" y2="287" stroke="#3b6387" stroke-width="2"/>
  <text x="390" y="253" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Mode: Audit</text>
  <text x="390" y="279" fill="#9fb2c7" font-family="Segoe UI, Arial, sans-serif" font-size="16">all represented actions are reads</text>
  <line x1="718" y1="231" x2="718" y2="287" stroke="#3b6387" stroke-width="2"/>
  <text x="749" y="253" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Tenant mutations</text>
  <text x="749" y="279" fill="#77e3bd" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="750">0 represented</text>

  <path d="M600 313 L600 342" stroke="#77d6ff" stroke-width="4"/>
  <path d="M589 333 L600 346 L611 333" fill="none" stroke="#77d6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="355" width="1060" height="430" rx="22" fill="url(#statusPanel)" stroke="#3b6387" stroke-width="2"/>
  </g>
  <text x="100" y="398" fill="#77d6ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">COLLECTION STATUS</text>
  <text x="100" y="444" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="750">Coverage is part of the result</text>

  <rect x="100" y="478" width="1000" height="58" rx="12" fill="#0d1c2b"/>
  <circle cx="129" cy="507" r="9" fill="#46d194"/>
  <text x="155" y="514" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Mailbox configuration</text>
  <rect x="905" y="491" width="166" height="32" rx="16" fill="#155d48"/>
  <text x="988" y="513" text-anchor="middle" fill="#eafff5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">COMPLETED</text>

  <rect x="100" y="548" width="1000" height="58" rx="12" fill="#0d1c2b"/>
  <circle cx="129" cy="577" r="9" fill="#46d194"/>
  <text x="155" y="584" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Message trace</text>
  <rect x="905" y="561" width="166" height="32" rx="16" fill="#155d48"/>
  <text x="988" y="583" text-anchor="middle" fill="#eafff5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">COMPLETED</text>

  <rect x="100" y="618" width="1000" height="58" rx="12" fill="#0d1c2b" stroke="#796237"/>
  <circle cx="129" cy="647" r="9" fill="#f3c767"/>
  <text x="155" y="654" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Unified audit log</text>
  <text x="695" y="654" text-anchor="end" fill="#c6d1dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">retention boundary</text>
  <rect x="905" y="631" width="166" height="32" rx="16" fill="#725c29"/>
  <text x="988" y="653" text-anchor="middle" fill="#fff8e5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">PARTIAL</text>

  <rect x="100" y="688" width="1000" height="58" rx="12" fill="#0d1c2b" stroke="#744a5c"/>
  <circle cx="129" cy="717" r="9" fill="#ff858d"/>
  <text x="155" y="724" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Defender mail detail</text>
  <text x="695" y="724" text-anchor="end" fill="#c6d1dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">unlicensed workload</text>
  <rect x="878" y="701" width="193" height="32" rx="16" fill="#70384d"/>
  <text x="974" y="723" text-anchor="middle" fill="#fff1f3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">UNAVAILABLE</text>

  <text x="100" y="773" fill="#f3c767" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="750">Partial and unavailable sources are not converted into a clean result.</text>

  <path d="M600 785 L600 814" stroke="#a997ff" stroke-width="4"/>
  <path d="M589 805 L600 818 L611 805" fill="none" stroke="#a997ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="827" width="1060" height="390" rx="22" fill="url(#queuePanel)" stroke="#5d5591" stroke-width="2"/>
  </g>
  <text x="100" y="870" fill="#b8adff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">INVESTIGATOR DECISION QUEUE</text>
  <text x="100" y="916" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="750">The next step remains explicit</text>

  <circle cx="130" cy="969" r="22" fill="#514684"/>
  <text x="130" y="977" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">1</text>
  <text x="170" y="965" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Validate the synthetic inbox rule</text>
  <text x="170" y="990" fill="#aebdd0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Confirm ownership, creation time, and business purpose.</text>

  <circle cx="130" cy="1039" r="22" fill="#514684"/>
  <text x="130" y="1047" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">2</text>
  <text x="170" y="1035" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Correlate the after-hours message lead</text>
  <text x="170" y="1060" fill="#aebdd0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Compare with sign-in, endpoint, and approved activity evidence.</text>

  <circle cx="130" cy="1109" r="22" fill="#514684"/>
  <text x="130" y="1117" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">3</text>
  <text x="170" y="1105" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Resolve the audit-retention gap</text>
  <text x="170" y="1130" fill="#aebdd0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Do not close the review while the coverage boundary remains.</text>

  <circle cx="130" cy="1179" r="22" fill="#514684"/>
  <text x="130" y="1187" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">4</text>
  <text x="170" y="1175" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Preserve exports and refresh the manifest</text>
  <text x="170" y="1200" fill="#aebdd0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Regenerate it after adding trusted external evidence.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="1250" width="1060" height="155" rx="20" fill="#101e2e" stroke="#3b6387" stroke-width="2"/>
  </g>
  <text x="100" y="1287" fill="#77d6ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.3">EVIDENCE BOUNDARY</text>
  <text x="100" y="1321" fill="#f5f8fc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Provides: chained action log + SHA-256 manifest</text>
  <text x="100" y="1352" fill="#b5c4d3" font-family="Segoe UI, Arial, sans-serif" font-size="16">Does not provide: trusted timestamp, digital signature, or organizational chain of custody.</text>
  <text x="100" y="1385" fill="#f3c767" font-family="Segoe UI, Arial, sans-serif" font-size="15">Read access can still expose sensitive tenant data. Use an approved lab and protected case storage.</text>

  <rect x="70" y="1430" width="1060" height="30" rx="10" fill="#08131f" stroke="#3b6387"/>
  <text x="92" y="1450" fill="#77d6ff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">SANITIZED FIXTURE RESULT</text>
  <text x="325" y="1450" fill="#8fa4b9" font-family="Segoe UI, Arial, sans-serif" font-size="11">|</text>
  <text x="345" y="1450" fill="#d7e1eb" font-family="Segoe UI, Arial, sans-serif" font-size="11">Not collected from a tenant. Not evidence of an incident.</text>
  <text x="1107" y="1450" text-anchor="end" fill="#8fa4b9" font-family="Segoe UI, Arial, sans-serif" font-size="10">protected-main evidence</text>
</svg>
